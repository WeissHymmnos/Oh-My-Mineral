[package]
name = "mineral-gui-bridge"
version = "0.1.0"
edition = "2024"
description = "JSON-lines bridge from Mineral GUI clients to the Mineral daemon"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "mineral-gui-bridge"
path = "src/main.rs"

[dependencies]
mineral-audio = { path = "../vendor/mineral-audio" }
mineral-channel-apple-music = { path = "../vendor/mineral-channel-apple-music" }
mineral-channel-bilibili = { path = "../vendor/mineral-channel-bilibili" }
mineral-channel-core = { path = "../vendor/mineral-channel-core" }
mineral-channel-local = { path = "../vendor/mineral-channel-local" }
mineral-channel-mineral = { path = "../vendor/mineral-channel-mineral" }
mineral-channel-netease = { path = "../vendor/mineral-channel-netease" }
mineral-client = { path = "../vendor/mineral-client" }
mineral-common = { path = "../vendor/mineral-common" }
mineral-config = { path = "../vendor/mineral-config" }
mineral-log = { path = "../vendor/mineral-log" }
mineral-model = { path = "../vendor/mineral-model" }
mineral-paths = { path = "../vendor/mineral-paths" }
mineral-playback = { path = "../vendor/mineral-playback" }
mineral-protocol = { path = "../vendor/mineral-protocol" }
mineral-script = { path = "../vendor/mineral-script" }
mineral-server = { path = "../vendor/mineral-server" }
mineral-stats = { path = "../vendor/mineral-stats" }
mineral-task = { path = "../vendor/mineral-task" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "process", "net", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
