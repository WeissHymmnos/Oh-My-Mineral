[workspace]
resolver = "2"
members = [
  "bridge",
  "crates/mineral-gui-core",
  "crates/mineral-gui-gtk",
  "crates/mineral-gui-qt",
]

[patch.crates-io]
mineral-paths = { path = "vendor/mineral-paths" }
mineral-protocol = { path = "vendor/mineral-protocol" }
mineral-script = { path = "vendor/mineral-script" }
mineral-server = { path = "vendor/mineral-server" }
