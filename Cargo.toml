[workspace]
resolver = "2"
members = [
  "bridge",
  "crates/mineral-gui-core",
  "crates/mineral-gui-gtk",
  "crates/mineral-gui-qt",
]
exclude = ["vendor"]

[patch.crates-io]
symphonia-bundle-flac = { path = "vendor/symphonia-bundle-flac" }
symphonia-format-isomp4 = { path = "vendor/symphonia-format-isomp4" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

[profile.dev]
panic = "unwind"

