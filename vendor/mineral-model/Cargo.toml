[package]
name = "mineral-model"
description = "跨 channel 的统一数据模型(Song / Playlist / Lyrics 等)"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
derive-getters = "0.5"
mineral-macros = { path = "../mineral-macros", version = "0.6.0" }
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
typed-builder = "0.20"
url = { version = "2", features = ["serde"] }
