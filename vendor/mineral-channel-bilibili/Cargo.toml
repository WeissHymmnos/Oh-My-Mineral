[package]
name = "mineral-channel-bilibili"
description = "哔哩哔哩 channel 实现(WBI 签名 / 搜索 / 详情 / 播放 URL)"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
mineral-model = { path = "../mineral-model", version = "0.6.0" }
mineral-channel-core = { path = "../mineral-channel-core", version = "0.6.0" }
mineral-paths = { path = "../mineral-paths", version = "0.6.0" }
mineral-log = { path = "../mineral-log", version = "0.6.0" }
mineral-playback = { path = "../mineral-playback", version = "0.6.0" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
tokio = { version = "1.45.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
isahc = { version = "1.7", features = ["cookies"] }
url = { version = "2", features = ["serde"] }
rustc-hash = "2"
thiserror = "1"
typed-builder = "0.20"
derive-getters = "0.5"
once_cell = "1.21"
md-5 = "0.10"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
qrcode = "0.14"
