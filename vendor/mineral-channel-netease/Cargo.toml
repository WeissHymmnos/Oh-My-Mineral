[package]
name = "mineral-channel-netease"
description = "Mineral 的一个 channel 实现(加密 + cookie + 端点)"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
mineral-model = { path = "../mineral-model", version = "0.6.0" }
mineral-channel-core = { path = "../mineral-channel-core", version = "0.6.0" }
mineral-paths = { path = "../mineral-paths", version = "0.6.0" }
mineral-log = { path = "../mineral-log", version = "0.6.0" }
mineral-playback = { path = "../mineral-playback", version = "0.6.0" }
typed-builder = "0.20"
derive-getters = "0.5"
aes = "0.8"
cbc = "0.1"
ecb = "0.1"
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
md-5 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
base64 = "0.22"
hex = "0.4"
isahc = { version = "1.7", features = ["cookies"] }
governor = { version = "0.10", default-features = false, features = ["std"] }
url = { version = "2", features = ["serde"] }
regex = "1"
flate2 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
async-stream = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
once_cell = "1.21"
rand = "0.9"
rustc-hash = "2"
thiserror = "1"
tokio = { version = "1.45.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
clap = { version = "4.5", features = ["derive"] }
qrcode = "0.14"
