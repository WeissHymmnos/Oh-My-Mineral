[package]
name = "mineral-script"
description = "daemon 音乐回调与 TUI 本地脚本的独立 Lua 执行宿主"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
mineral-log = { path = "../mineral-log", version = "0.6.0" }
mineral-model = { path = "../mineral-model", version = "0.6.0" }
mineral-paths = { path = "../mineral-paths", version = "0.6.0" }
mineral-protocol = { path = "../mineral-protocol", version = "0.6.0" }
thiserror = "1"
derive-getters = "0.5"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "send"] }
parking_lot = "0.12"
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45.1", features = ["full"] }
typed-builder = "0.20"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "mman", "poll", "signal", "hostname"] }
