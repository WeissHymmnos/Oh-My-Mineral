[package]
name = "mineral-server"
description = "Mineral 后台 server:收纳 audio engine + task scheduler + channels,对外发 ClientHandle"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
mineral-common = { path = "../mineral-common", version = "0.6.0" }
sea-orm = { version = "2.0.2", default-features = false, features = ["macros", "sqlx-sqlite", "runtime-tokio", "sqlite-use-returning-for-3_35", "with-chrono"] }
sea-orm-migration = { version = "2.0.2", default-features = false, features = ["runtime-tokio", "sqlx-sqlite"] }
async-trait = "0.1"
async-stream = "0.3"
mineral-audio = { path = "../mineral-audio", version = "0.6.0" }
mineral-channel-core = { path = "../mineral-channel-core", version = "0.6.0" }
mineral-config = { path = "../mineral-config", version = "0.6.0" }
mineral-config-macros = { path = "../mineral-config-macros", version = "0.6.0" }
mineral-script = { path = "../mineral-script", version = "0.6.0" }
num-traits = "0.2"
rustc-hash = "2"
mineral-log = { path = "../mineral-log", version = "0.6.0" }
mineral-media = { path = "../mineral-media", version = "0.6.0" }
mineral-model = { path = "../mineral-model", version = "0.6.0" }
mineral-paths = { path = "../mineral-paths", version = "0.6.0" }
mineral-persist = { path = "../mineral-persist", version = "0.6.0" }
mineral-playback = { path = "../mineral-playback", version = "0.6.0" }
mineral-protocol = { path = "../mineral-protocol", version = "0.6.0" }
mineral-stats = { path = "../mineral-stats", version = "0.6.0" }
mineral-task = { path = "../mineral-task", version = "0.6.0" }
mineral-channel-mineral = { path = "../mineral-channel-mineral", version = "0.6.0" }
bytes = "1"
arc-swap = "1"
thiserror = "1"
derive-getters = "0.5"
futures-util = "0.3"
lofty = "0.22"
parking_lot = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = "0.3"
tokio = { version = "1.45.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
typed-builder = "0.20"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
