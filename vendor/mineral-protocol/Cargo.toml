[package]
name = "mineral-protocol"
description = "Mineral client/server IPC 协议 — Request/Response enum + bincode + length-delimited framing"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
mineral-common = { path = "../mineral-common", version = "0.6.0" }
mineral-audio = { path = "../mineral-audio", version = "0.6.0" }
mineral-channel-core = { path = "../mineral-channel-core", version = "0.6.0" }
mineral-model = { path = "../mineral-model", version = "0.6.0" }
mineral-task = { path = "../mineral-task", version = "0.6.0" }
bincode = "1.3"
bytes = "1"
derive-getters = "0.5"
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum_macros = "0.27"
thiserror = "1"
tokio = { version = "1.45.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures-util = { version = "0.3", features = ["sink"] }
typed-builder = "0.20"
async-trait = "0.1"
